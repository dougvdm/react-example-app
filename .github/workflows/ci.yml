name: CI

on:
  push:
    branches:
      - master
      - 'test/**'
  pull_request:
    branches:
      - master

jobs:
  lint-and-test:
    name: 🧪 Validação & Testes
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout do Código
        uses: actions/checkout@v4

      - name: Executar Testes
        run: |
          echo "Executando suite de testes..."

  security-scan:
    name: 🛡️ DevSecOps (SAST Semgrep & Container Trivy)
    needs: [lint-and-test]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read

    steps:
      - name: 📥 Checkout do Código
        uses: actions/checkout@v4

      - name: 🔍 SAST com Semgrep (Regras OWASP Top 10)
        uses: semgrep/semgrep-action@v1
        with:
          config: >-
            p/owasp-top-ten
            p/security-audit
          auditOn: push

      - name: 🐳 Compilar Imagem Docker Efêmera para Análise
        run: |
          docker build -t app-audit:local .

      - name: 🛡️ Escanear Imagem Docker com Aqua Security Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'app-audit:local'
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'
