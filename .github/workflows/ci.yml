name: CI

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master]

jobs:
  # -------------------------------------------------------------
  # JOB 1: Testes e Validação
  # -------------------------------------------------------------
  lint-and-test:
    name: 🧪 Validação & Testes
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout do Código
        uses: actions/checkout@v4

      - name: Executar Testes
        run: |
          echo "Executando suite de testes..."
          # Adicione aqui os comandos do seu projeto (ex: npm test, pytest, etc.)

  # -------------------------------------------------------------
  # JOB 2: Segurança (Só roda se o JOB 1 passar)
  # -------------------------------------------------------------
  security-scan:
    name: 🛡️ DevSecOps (SAST Semgrep & Container Trivy)
    needs: [lint-and-test] # Depende do sucesso do job acima
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read

    steps:
      - name: 📥 Checkout do Código
        uses: actions/checkout@v4

      # ETAPA 1: SAST Semgrep
      - name: 🔍 SAST com Semgrep (Regras OWASP Top 10)
        uses: semgrep/semgrep-action@v1
        with:
          config: >-
            p/owasp-top-ten
            p/security-audit
          auditOn: push

      # ETAPA 2: Build da Imagem Docker
      - name: 🐳 Compilar Imagem Docker Efêmera para Análise
        run: |
          docker build -t app-audit:local .

      # ETAPA 3: Scanner Trivy
      - name: 🛡️ Escanear Imagem Docker com Aqua Security Trivy
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: 'app-audit:local'
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'
